<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07070a" />
<title>Vinyl · Spotify Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css?v=31" />
</head>
<body>
  <!-- GPU canvas sits behind everything -->
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <audio id="local-audio" preload="metadata" crossorigin="anonymous"></audio>
  <input id="file-input" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.aac,.opus" multiple hidden />

  <!-- ─────────── Top bar ─────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">VINYL<em>·</em>GL</span>
    </div>
    <div class="top-right">
      <div class="source-switch" role="tablist" aria-label="Playback source">
        <button id="mode-spotify" class="source-btn on" role="tab" aria-selected="true">Spotify</button>
        <button id="mode-local" class="source-btn" role="tab" aria-selected="false">Local file</button>
      </div>
      <span id="status-pill" class="pill"><i></i><span>connecting</span></span>
      <button id="btn-login" class="ghost-btn hidden">Sign in with Spotify</button>
    </div>
  </header>

  <!-- ─────────── Now playing (left) ─────────── -->
  <section class="now-playing">
    <div class="np-eyebrow">Now playing</div>
    <h1 id="track-name">—</h1>
    <p id="track-artist" class="np-artist">Sign in to start</p>
    <p id="track-album" class="np-album"></p>

    <div class="progress-wrap">
      <div class="time-row">
        <span id="time-cur" class="mono">0:00</span>
        <span id="time-dur" class="mono">0:00</span>
      </div>
      <div id="progress" class="progress" role="slider" tabindex="0" aria-label="Seek">
        <div id="progress-fill" class="progress-fill"></div>
        <div id="progress-knob" class="progress-knob"></div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-shuffle" class="icon-btn" title="Shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button id="btn-prev" class="icon-btn" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16zM5 19V5"/></svg>
      </button>
      <button id="btn-play" class="play-btn" title="Play" aria-label="Play">
        <svg id="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ic-pause" class="hidden" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button id="btn-next" class="icon-btn" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg>
      </button>
      <button id="btn-repeat" class="icon-btn" title="Repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg class="vol-ic" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <input id="volume" type="range" min="0" max="100" value="65" aria-label="Volume" />
      <span id="vol-label" class="mono">65</span>
    </div>

    <div class="queue" id="spotify-lists">
      <div class="queue-head">
        <span>Up next</span>
        <span id="queue-count" class="mono"></span>
      </div>
      <ul id="queue-list"></ul>
      <div class="queue-head playlists-head">
        <span>Playlists</span>
      </div>
      <ul id="playlist-list"></ul>
    </div>

    <div class="queue hidden" id="local-lists">
      <div class="queue-head">
        <span>Local files</span>
        <span id="local-count" class="mono"></span>
      </div>
      <div class="local-actions">
        <button id="btn-add-files" class="ghost-btn sm">Add audio files</button>
        <button id="btn-clear-files" class="ghost-btn sm">Clear</button>
      </div>
      <ul id="local-list"></ul>
      <p class="local-hint">MP3, WAV, OGG, FLAC, M4A.</p>
    </div>
  </section>

  <!-- ─────────── Footer ─────────── -->
  <footer class="footer">
    <span class="mono" id="renderer-info">WebGL2</span>
    <span class="dot">·</span>
    <span>Empty GPU scene</span>
  </footer>
  <div id="toast" class="toast hidden"></div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script type="module" src="/app.js?v=31"></script>
</body>
</html>
